name: Markdown plugin
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --json
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-npm-${{ matrix.os }}-node-${{ matrix.node }}
          path: "*.tgz"
          if-no-files-found: error
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: textgraph-markdown-vsix-${{ matrix.os }}-node-${{ matrix.node }}
          path: vscode/*.vsix
          if-no-files-found: error
  browser:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: markdown-browser-failures-node-${{ matrix.node }}
          path: test-results/
