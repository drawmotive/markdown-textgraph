name: Publish Markdown npm package
on:
  workflow_dispatch:
    inputs:
      verify_trust_only:
        description: Verify npm OIDC trust without publishing an archive
        required: false
        default: false
        type: boolean
      artifact_tag:
        description: Draft release retaining the already tested archive
        required: false
        type: string
      archive_file:
        description: Exact retained archive filename
        required: false
        type: string
      artifact_integrity:
        description: Reviewed SHA512 integrity
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: markdown-npm-publication
  cancel-in-progress: false
jobs:
  trust:
    if: inputs.verify_trust_only
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the npm trusted publisher without publishing
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identity = await fetch(url, {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
          });
          assert.ok(identity.ok, 'GitHub OIDC request failed: HTTP ' + identity.status);
          const { value } = await identity.json();
          assert.ok(value, 'GitHub OIDC token missing');
          const exchange = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40drawmotive%2Fmarkdown-it-textgraph', {
            method: 'POST', headers: { Authorization: 'Bearer ' + value },
          });
          assert.ok(exchange.ok, 'npm trusted publisher exchange failed: HTTP ' + exchange.status + '; check repository drawmotive/markdown-textgraph, workflow release.yml, environment npm');
          const result = await exchange.json();
          assert.equal(result.token_type, 'oidc', 'npm returned an unexpected token type');
          assert.ok(result.token, 'npm trusted publisher exchange returned no token');
          console.log('npm accepted the GitHub Actions identity; no package was published.');
          JS
  resolve:
    if: ${{ !inputs.verify_trust_only && inputs.artifact_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tooling/npm-release.mjs check
  test:
    needs: resolve
    uses: ./.github/workflows/ci.yml
  pack:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tooling/npm-release.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-npm-release
          path: |
            .release/*.tgz
            .release/npm-release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v4
        with:
          name: markdown-npm-release
          path: .release
      # No static npm credential is available: a failed trust exchange must stop
      # publication instead of silently publishing under a personal identity.
      - name: Require GitHub OIDC publication credentials
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "$NODE_AUTH_TOKEN"
          test -z "$NPM_TOKEN"
      - name: Publish and verify the exact tested archive
        run: node tooling/npm-release.mjs publish
  retained:
    if: ${{ !inputs.verify_trust_only && inputs.artifact_tag != '' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.19.1
      # Keep publication dependent on the configured repository/workflow trust.
      - name: Require GitHub OIDC publication credentials
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "$NODE_AUTH_TOKEN"
          test -z "$NPM_TOKEN"
      - name: Download the reviewed archive without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
          ARCHIVE_FILE: ${{ inputs.archive_file }}
        run: gh release download "$ARTIFACT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE_FILE" --pattern github-evidence.json --dir .retained
      - name: Verify commit and retained bytes, publish with trusted npm identity
        env:
          ARTIFACT_INTEGRITY: ${{ inputs.artifact_integrity }}
          ARCHIVE_FILE: ${{ inputs.archive_file }}
          RECEIPT_FILE: github-evidence.json
        run: node ./.release/remote-npm.mjs .retained .
