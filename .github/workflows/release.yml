name: Publish Markdown npm package
on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: Draft release retaining the already tested archive
        required: false
        type: string
      archive_file:
        description: Exact retained archive filename
        required: false
        type: string
      artifact_integrity:
        description: Reviewed SHA512 integrity
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: markdown-npm-publication
  cancel-in-progress: false
jobs:
  resolve:
    if: inputs.artifact_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tooling/npm-release.mjs check
  test:
    needs: resolve
    uses: ./.github/workflows/ci.yml
  pack:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tooling/npm-release.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-npm-release
          path: |
            .release/*.tgz
            .release/npm-release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.11.1
      - uses: actions/download-artifact@v4
        with:
          name: markdown-npm-release
          path: .release
      # npm prefers OIDC. The optional token bootstraps the first publication
      # before the package owner can configure its npm trusted publisher.
      - name: Publish and verify the exact tested archive
        run: node tooling/npm-release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  retained:
    if: inputs.artifact_tag != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.19.1
      - name: Download the reviewed archive without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
          ARCHIVE_FILE: ${{ inputs.archive_file }}
        run: gh release download "$ARTIFACT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE_FILE" --pattern github-evidence.json --dir .retained
      - name: Verify commit and retained bytes, publish with trusted npm identity
        env:
          ARTIFACT_INTEGRITY: ${{ inputs.artifact_integrity }}
          ARCHIVE_FILE: ${{ inputs.archive_file }}
          RECEIPT_FILE: github-evidence.json
        run: node ./.release/remote-npm.mjs .retained .
