name: VS Code extension
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested VSIX to VS Code Marketplace
        type: boolean
        default: false
  pull_request:
    paths: ['vscode/**', '.github/workflows/vscode-release.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm test
      - run: npm run package
      - run: xvfb-run -a npm run test:host
        env:
          TEXTGRAPH_HOST_ARTIFACTS: ${{ runner.temp }}/textgraph-minimum
      - run: xvfb-run -a npm run test:host
        env:
          VSCODE_VERSION: stable
          TEXTGRAPH_HOST_ARTIFACTS: ${{ runner.temp }}/textgraph-stable
      - run: sha256sum *.vsix > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: textgraph-markdown-vsix
          path: |
            vscode/*.vsix
            vscode/SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textgraph-host-evidence
          path: |
            ${{ runner.temp }}/textgraph-minimum/*/result.json
            ${{ runner.temp }}/textgraph-minimum/*/*.png
            ${{ runner.temp }}/textgraph-stable/*/result.json
            ${{ runner.temp }}/textgraph-stable/*/*.png
      - if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo 'Missing VSCE_PAT: configure a Marketplace Manage credential with drawmotive publisher access.'
            exit 1
          fi
          npx vsce verify-pat drawmotive
          npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
